plugins {
    id 'com.android.application'
}

def meditrackApiBaseUrl = project.findProperty('MEDTRACK_API_BASE_URL') ?: 'http://10.0.2.2:8080/api/'

android {
    namespace 'com.meditrack'
    compileSdk 36

    defaultConfig {
        applicationId 'com.meditrack'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', '"' + meditrackApiBaseUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
